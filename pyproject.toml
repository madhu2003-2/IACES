[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iaces-fitpredict-ai"
version = "0.1.0"
description = "FitPredict AI workout and calorie estimation application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0,<4.0",
    "joblib>=1.3,<2.0",
    "matplotlib>=3.8,<4.0",
    "mysql-connector-python>=8.3,<10.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.1,<4.0",
    "plotly>=5.20,<7.0",
    "python-dotenv>=1.0,<2.0",
    "requests>=2.31,<3.0",
    "scikit-learn>=1.4,<2.0",
    "seaborn>=0.13,<1.0",
    "streamlit>=1.32,<2.0",
]

[project.scripts]
fitpredict-api = "iaces.api.app:main"
fitpredict-train = "iaces.ml.train_model:main"
fitpredict-evaluate = "iaces.ml.evaluate_model:main"
fitpredict-train-nutrition = "iaces.ml.train_nutrition_model:main"

[project.optional-dependencies]
hosting = [
    "waitress>=3.0.2,<4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
