$kind: http-request
url: "{{base_url}}/calories"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "age": 25,
      "gender": "Male",
      "weight": 70,
      "duration": 45,
      "heart_rate": 130,
      "user_name": "{{user_name}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('returns HTTP 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('returns a non-negative kcal estimate', () => { pm.expect(body.success).to.eql(true); pm.expect(body.estimated_calories).to.be.a('number'); pm.expect(body.estimated_calories).to.be.at.least(0); pm.expect(body.unit).to.eql('kcal'); });
    language: text/javascript
order: 2000
