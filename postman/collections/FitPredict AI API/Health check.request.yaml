$kind: http-request
url: "{{base_url}}/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('returns HTTP 200', () => pm.response.to.have.status(200));
      pm.test('reports API status', () => pm.expect(pm.response.json().status).to.eql('ok'));
      pm.test('includes model readiness', () => pm.expect(pm.response.json()).to.have.property('model_available'));
    language: text/javascript
order: 1000
