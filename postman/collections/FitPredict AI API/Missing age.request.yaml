$kind: http-request
url: "{{base_url}}/calories"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"gender":"Male","weight":70,"duration":45,"heart_rate":130}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('returns HTTP 400', () => pm.response.to.have.status(400));
      pm.test('identifies missing age', () => pm.expect(pm.response.json().errors.join(' ')).to.include('age'));
    language: text/javascript
order: 3000
