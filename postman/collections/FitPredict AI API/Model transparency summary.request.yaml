$kind: http-request
url: "{{base_url}}/model-info"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('returns HTTP 200 after a model is trained', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('includes holdout metrics and global feature importance', () => { pm.expect(body.success).to.eql(true); pm.expect(body).to.have.property('holdout_metrics'); pm.expect(body.feature_importance).to.be.an('array'); });
    language: text/javascript
order: 11000
