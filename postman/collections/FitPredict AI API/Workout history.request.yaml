$kind: http-request
url: "{{base_url}}/workouts?user_name={{user_name}}"
method: GET
queryParams:
  user_name: "{{user_name}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('returns history or a clear disabled response', () => pm.expect([200, 503]).to.include(pm.response.code));
      if (pm.response.code === 200) pm.test('returns a workouts array', () => pm.expect(pm.response.json().workouts).to.be.an('array'));
    language: text/javascript
order: 12000
