services:
  - type: web
    name: iaces-fitpredict
    runtime: python
    plan: free
    branch: main
    buildCommand: uv sync --locked --extra hosting && uv run --no-sync python deploy/prepare_food.py
    startCommand: uv run --no-sync python deploy/serve.py
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: STREAMLIT_SERVER_ENABLE_AGENT_API
        value: "false"
